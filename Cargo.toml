[package]
name = "rusty-the-screeper"
version = "0.1.0"
authors = ["Malte Linke <me@parzival.space>"]
edition = "2024"

[lib]
path = "src/main/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.94"
screeps-game-api = "0.23.3"
wasm-bindgen = "0.2.117"
web-sys = "0.3.94"

# logging
log = "0.4.29"
fern = "0.7.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]