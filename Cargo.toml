[package]
name = "rusty-the-screeper"
version = "0.1.0"
authors = ["Malte Linke <me@parzival.space>"]
edition = "2024"

[lib]
path = "src/main/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# screeps
screeps-game-api = "0.23.3"

# developer utilities
dyn-clone = "1.0.20"

# wasm stuff
js-sys = "0.3.94"
wasm-bindgen = "0.2.117"
web-sys = "0.3.94"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }

# uuid
uuid = { version = "1.23.0", default-features = false }
rand = { version = "0.10.0", default-features = false }
rand_xorshift = { version = "0.5.0", default-features = false }

# logging
log = "0.4.29"
simplelog = "0.12.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]